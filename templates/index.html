<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giọng Nhà Đài</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main class="wrap"><section class="card"><div class="badge">VIETNAMESE TTS</div><h1>Giọng Nhà Đài</h1><p class="sub">Chuyển văn bản thành giọng đọc tiếng Việt phong cách thời sự, bản tin, thuyết minh và quảng cáo.</p>
<label>Văn bản</label><textarea id="text" maxlength="12000" placeholder="Nhập nội dung cần đọc..."></textarea><div class="meta"><span id="count">0 ký tự</span><button id="sample" class="link">Điền đoạn mẫu</button></div>
<div class="grid"><div><label>Phong cách</label><select id="preset"><option value="nam_thoi_su">Nam thời sự</option><option value="nu_thoi_su">Nữ thời sự</option><option value="ban_tin_nhanh">Bản tin nhanh</option><option value="thuyet_minh">Thuyết minh</option><option value="quang_cao">Quảng cáo</option></select></div><div><label>Tốc độ</label><select id="rate"><option value="-15%">Chậm</option><option value="-5%" selected>Chuẩn nhà đài</option><option value="+5%">Nhanh</option><option value="+12%">Rất nhanh</option><option value="+18%">Quảng cáo sôi động</option></select></div></div>
<button id="go" class="primary">Tạo giọng nói</button><div id="status"></div><div id="player" class="player hidden"><audio id="audio" controls></audio><a id="download" class="download" download="giong-nha-dai.mp3">Tải MP3</a></div>
<p class="foot">Không cần API key trong bản này. Dịch vụ giọng nói cần kết nối Internet và có thể thay đổi theo nhà cung cấp.</p></section></main>
<script>
const text=document.querySelector('#text'),count=document.querySelector('#count'),go=document.querySelector('#go'),status=document.querySelector('#status'),player=document.querySelector('#player'),audio=document.querySelector('#audio'),download=document.querySelector('#download'),preset=document.querySelector('#preset'),rate=document.querySelector('#rate');
const presetRates={nam_thoi_su:'-5%',nu_thoi_su:'-5%',ban_tin_nhanh:'+5%',thuyet_minh:'-15%',quang_cao:'+12%'};
preset.onchange=()=>{rate.value=presetRates[preset.value]||'-5%';};
text.oninput=()=>count.textContent=`${text.value.length.toLocaleString('vi-VN')} ký tự`;
document.querySelector('#sample').onclick=()=>{text.value='Kính chào quý vị và các bạn. Sau đây là những thông tin đáng chú ý trong bản tin hôm nay. Các nội dung sẽ được cập nhật nhanh chóng, chính xác và dễ theo dõi.';text.oninput()};
go.onclick=async()=>{if(!text.value.trim())return alert('Bạn chưa nhập văn bản.');go.disabled=true;status.textContent='Đang tạo giọng nói...';player.classList.add('hidden');try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value,preset:preset.value,rate:rate.value})});const d=await r.json();if(!d.ok)throw new Error(d.error||'Có lỗi xảy ra');audio.src=d.url;download.href=d.url;player.classList.remove('hidden');status.textContent='Đã tạo xong.';audio.play().catch(()=>{});}catch(e){status.textContent=e.message;}finally{go.disabled=false;}};
</script></body></html>
